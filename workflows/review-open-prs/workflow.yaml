schema: flows/v1
id: review-open-prs
version: 2.0.0
description: Find open GitHub pull requests assigned to you and start an independent review session for each one.
nodes:
  discover_assigned_prs:
    uses: github.list-assigned-pull-requests
    with: {}
  review_each_pr:
    uses: core.harness
    needs: [discover_assigned_prs]
    for_each:
      items: ${{ nodes.discover_assigned_prs.outputs.pull_requests }}
      key: ${{ item.repository }}:${{ item.number }}:${{ item.head_sha }}
    with:
      prompt_template: ./prompts/review.md
      arguments:
        repository: ${{ item.repository }}
        pr_number: ${{ item.number }}
        head_sha: ${{ item.head_sha }}
        title: ${{ item.title }}
        url: ${{ item.url }}
outputs:
  reviews: ${{ nodes.review_each_pr.outputs }}
