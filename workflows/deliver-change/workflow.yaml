schema: flows/v1
id: deliver-change
version: 1.0.0
description: Turn a change request into task groups, approve the groups, and have coding agents draft and review a plan for each group.
inputs:
  request:
    type: string
    required: true
  repositories:
    type: array
    required: true
  tracker_provider:
    type: string
    default: jira
    enum: [jira, youtrack]
    description: Issue tracker for the requested change
  code_host:
    type: string
    default: github
    enum: [github, gitlab]
    description: Hosting provider for the repositories
  chat_channel:
    type: string
    default: engineering
  auto_approve:
    type: boolean
    default: false
nodes:
  group_work:
    uses: core.harness
    with:
      harness: claude
      prompt_template: ./prompts/group.md
      arguments:
        request: ${{ inputs.request }}
        repositories: ${{ inputs.repositories }}
    outputs:
      groups: {type: array, required: true}
  approve_groups:
    uses: core.notify
    needs: [group_work]
    with:
      approval: true
      auto_approve: ${{ inputs.auto_approve }}
      title: Approve Task Groups
      body: Review proposed task groups for ${{ inputs.request }}
  plan_group:
    workflow: ./flows/plan-group.yaml
    needs: [approve_groups]
    for_each:
      items: ${{ nodes.group_work.outputs.groups }}
      key: ${{ item.id }}
    with:
      group_id: ${{ item.id }}
      goal: ${{ item.goal }}
      repository: ${{ item.repository }}
  reconcile_plans:
    uses: core.harness
    needs: [plan_group]
    with:
      harness: claude
      prompt_template: ./prompts/reconcile-plans.md
      arguments:
        request: ${{ inputs.request }}
        plans: ${{ nodes.plan_group.outputs }}
    outputs:
      approved: {type: boolean, required: true}
outputs:
  groups: ${{ nodes.group_work.outputs.groups }}
  reconciled: ${{ nodes.reconcile_plans.outputs.approved }}
